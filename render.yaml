# Render Blueprint — one-click shareable demo deploy.
# In the Render dashboard: New > Blueprint > connect this repo. Render reads this file.
# Free plan: public HTTPS URL, spins down after ~15 min idle (first hit cold-starts ~50s).
services:
  - type: web
    name: tripsecure-flightdelay-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Demo mode: serves the demo UI at / and the /demo/simulate route.
      - key: DEMO_MODE
        value: "True"
      # Mock the flight-data vendor (no FlightAware/AeroDataBox keys needed).
      - key: MOCK_PROVIDERS
        value: "True"
      # Real messaging via the Twilio WhatsApp sandbox (flight data stays mocked).
      - key: MOCK_MESSAGING
        value: "False"
      - key: APP_ENV
        value: "demo"
      - key: LOG_LEVEL
        value: "INFO"
      # DATABASE_URL intentionally unset -> app falls back to on-container SQLite.

      # ---- Twilio (set these values in the Render dashboard, NOT in git) ----
      # WhatsApp sandbox sender + trial SMS number are not secret -> kept here.
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: TWILIO_SMS_FROM
        value: "+19132780553"
      # Secrets -> sync:false means Render keeps the value you enter in the
      # dashboard and never reads it from this file.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
